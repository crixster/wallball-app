<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Wall Ball AI Tracker</title>
    <meta name="theme-color" content="#060a13">

    <!-- Icons & Static PWA Manifest -->
    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="manifest" href="manifest.json">

    <script>
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => e.waitUntil(self.skipWaiting()));
                self.addEventListener('activate', e => e.waitUntil(self.clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request)));
            `;
            const swBlob = new Blob([swCode], {type: 'application/javascript'});
            navigator.serviceWorker.register(URL.createObjectURL(swBlob)).catch(() => {});
        }
    </script>

    <!-- MediaPipe Pose Dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-void: #060a13;
            --panel: rgba(13, 18, 30, 0.90);
            --panel-border: rgba(148, 163, 184, 0.16);
            --ink: #f1f5f9;
            --ink-dim: #93a1b8;

            --valid: #34d399;
            --valid-bg: rgba(52, 211, 153, 0.14);
            --grey: #fbbf24;
            --grey-bg: rgba(251, 191, 36, 0.14);
            --norep: #f87171;
            --norep-bg: rgba(248, 113, 113, 0.14);
            --accent: #22d3ee;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
        }

        html, body {
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg-void);
            color: var(--ink);
            overflow: hidden;
        }

        #app-container { position: relative; width: 100vw; height: 100vh; background: #000; }
        video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }

        /* ---------- Install banner ---------- */
        .pwa-banner {
            position: absolute;
            top: calc(12px + var(--safe-top));
            left: 12px;
            right: 12px;
            z-index: 100;
            background: var(--panel);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 14px 16px;
            border-radius: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 8px 24px rgba(0,0,0,0.35);
        }
        .pwa-banner-text { display: flex; flex-direction: column; line-height: 1.25; }
        .pwa-banner-text strong { font-size: 15px; }
        .pwa-banner-text span { font-size: 12px; color: var(--ink-dim); }
        .install-btn {
            background: var(--accent);
            color: #04252b;
            border: none;
            padding: 10px 18px;
            font-weight: 700;
            font-size: 14px;
            border-radius: 10px;
            cursor: pointer;
            white-space: nowrap;
        }
        .install-btn:active { filter: brightness(0.92); }

        /* ---------- Top-right controls ---------- */
        .top-controls {
            position: absolute;
            top: calc(14px + var(--safe-top));
            right: 14px;
            z-index: 95;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .icon-btn {
            width: 68px;
            height: 68px;
            border-radius: 50%;
            background: var(--panel);
            border: 1px solid var(--panel-border);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: var(--ink);
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
            transition: transform 0.12s ease, background 0.15s ease;
        }
        .icon-btn:active { transform: scale(0.92); background: rgba(34, 211, 238, 0.18); }
        .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

        /* ---------- Verdict badge ---------- */
        .verdict-badge {
            position: absolute;
            top: calc(84px + var(--safe-top));
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            z-index: 90;
            padding: 14px 30px;
            border-radius: 999px;
            font-weight: 900;
            font-size: clamp(18px, 5vw, 24px);
            letter-spacing: 0.3px;
            display: none;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.45);
            border: 1px solid rgba(255,255,255,0.18);
            animation: badge-pop 0.28s ease-out forwards;
        }
        @keyframes badge-pop {
            0% { transform: translateX(-50%) scale(0.85); opacity: 0; }
            60% { transform: translateX(-50%) scale(1.04); opacity: 1; }
            100% { transform: translateX(-50%) scale(1); opacity: 1; }
        }
        .verdict-valid { background: var(--valid); color: #06281c; }
        .verdict-grey  { background: var(--grey); color: #2b1d02; }
        .verdict-norep { background: var(--norep); color: #350707; }

        /* ---------- Bottom HUD ---------- */
        .hud-overlay {
            position: absolute;
            bottom: calc(16px + var(--safe-bottom));
            left: 12px;
            right: 12px;
            z-index: 90;
            background: var(--panel);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--panel-border);
            box-shadow: 0 -6px 30px rgba(0,0,0,0.4);
            padding: 22px 16px calc(16px + var(--safe-bottom) * 0);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .hud-total {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
        }
        .hud-total .total-val {
            font-size: clamp(84px, 28vw, 136px);
            font-weight: 900;
            line-height: 0.9;
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }
        .hud-total .total-lbl {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: var(--ink-dim);
            text-transform: uppercase;
        }

        .hud-breakdown {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
        }
        .stat-box {
            text-align: center;
            border-radius: 16px;
            padding: 14px 4px 12px;
            border: 1px solid transparent;
        }
        .stat-box.stat-valid { background: var(--valid-bg); border-color: rgba(52, 211, 153, 0.28); }
        .stat-box.stat-grey  { background: var(--grey-bg);  border-color: rgba(251, 191, 36, 0.28); }
        .stat-box.stat-norep { background: var(--norep-bg); border-color: rgba(248, 113, 113, 0.28); }

        .stat-val {
            font-size: clamp(38px, 11vw, 52px);
            font-weight: 900;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .stat-valid .stat-val { color: var(--valid); }
        .stat-grey  .stat-val { color: var(--grey); }
        .stat-norep .stat-val { color: var(--norep); }

        .stat-lbl {
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--ink-dim);
            margin-top: 4px;
        }

        @media (max-width: 340px) {
            .hud-total .total-val { font-size: 72px; }
            .stat-val { font-size: 32px; }
        }
    </style>
</head>
<body>
    <div id="app-container">
        <video id="videoInput" playsinline muted autoplay></video>
        <canvas id="outputCanvas"></canvas>

        <div class="pwa-banner" id="pwaBanner" style="display:none;">
            <div class="pwa-banner-text">
                <strong>Install Wallball AI</strong>
                <span>Add to your home screen for quick access</span>
            </div>
            <button class="install-btn" id="pwaInstallBtn">Install</button>
        </div>

        <div class="top-controls">
            <button class="icon-btn" id="flipCamBtn" aria-label="Flip camera">
                <svg viewBox="0 0 24 24" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                    <rect x="5" y="7" width="14" height="11" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <path d="M9 7l1.1-1.6h3.8L15 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="12" cy="12.5" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
                    <polygon points="2.5,12.5 6,9.3 6,15.7" fill="currentColor"/>
                    <polygon points="21.5,12.5 18,9.3 18,15.7" fill="currentColor"/>
                </svg>
            </button>
            <button class="icon-btn" id="resetBtn" aria-label="Reset counts">
                <svg viewBox="0 0 24 24" width="30" height="30" xmlns="http://www.w3.org/2000/svg">
                    <path d="M4.5 12a7.5 7.5 0 1 1 2.4 5.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
                    <polygon points="3,8 4.5,12.8 8.5,10.3" fill="currentColor"/>
                </svg>
            </button>
        </div>

        <div class="verdict-badge" id="verdictBadge">VALID REP</div>

        <div class="hud-overlay">
            <div class="hud-total">
                <div class="total-val" id="totalCount">0</div>
                <div class="total-lbl">Total Reps</div>
            </div>
            <div class="hud-breakdown">
                <div class="stat-box stat-valid">
                    <div class="stat-val" id="validCount">0</div>
                    <div class="stat-lbl">Valid</div>
                </div>
                <div class="stat-box stat-grey">
                    <div class="stat-val" id="greyCount">0</div>
                    <div class="stat-lbl">Grey</div>
                </div>
                <div class="stat-box stat-norep">
                    <div class="stat-val" id="noRepCount">0</div>
                    <div class="stat-lbl">No Rep</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // PWA Installation Trigger
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaBanner').style.display = 'flex';
        });

        document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    document.getElementById('pwaBanner').style.display = 'none';
                }
                deferredPrompt = null;
            }
        });

        // Audio Beep Engine
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'valid') {
                osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'norep') {
                osc.frequency.setValueAtTime(220, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Rep Tracker State
        let validReps = 0;
        let greyReps = 0;
        let noReps = 0;

        let repState = 'STANDING';
        let lowestHipYRatio = 0;

        function updateTotalDisplay() {
            document.getElementById('totalCount').innerText = validReps + greyReps + noReps;
        }

        document.getElementById('resetBtn').addEventListener('click', () => {
            validReps = 0;
            greyReps = 0;
            noReps = 0;
            document.getElementById('validCount').innerText = '0';
            document.getElementById('greyCount').innerText = '0';
            document.getElementById('noRepCount').innerText = '0';
            updateTotalDisplay();
            repState = 'STANDING';
        });

        function processSquatDepth(landmarks) {
            const leftHip = landmarks[23];
            const rightHip = landmarks[24];
            const leftKnee = landmarks[25];
            const rightKnee = landmarks[26];

            if (!leftHip || !rightHip || !leftKnee || !rightKnee) return;

            const avgHipY = (leftHip.y + rightHip.y) / 2;
            const avgKneeY = (leftKnee.y + rightKnee.y) / 2;

            if (repState === 'STANDING') {
                if (avgHipY > avgKneeY - 0.05) {
                    repState = 'SQUATTING';
                    lowestHipYRatio = avgHipY;
                }
            } else if (repState === 'SQUATTING') {
                if (avgHipY > lowestHipYRatio) {
                    lowestHipYRatio = avgHipY;
                }

                if (avgHipY < avgKneeY - 0.10) {
                    evaluateRep(lowestHipYRatio, avgKneeY);
                    repState = 'STANDING';
                }
            }
        }

        function evaluateRep(lowestHipY, kneeY) {
            const depthDiff = lowestHipY - kneeY;
            const badge = document.getElementById('verdictBadge');

            badge.style.display = 'block';
            badge.className = 'verdict-badge';
            // force reflow so the pop-in animation replays on rapid consecutive reps
            void badge.offsetWidth;

            if (depthDiff > 0.02) {
                validReps++;
                document.getElementById('validCount').innerText = validReps;
                badge.innerText = "VALID REP";
                badge.classList.add('verdict-valid');
                playBeep('valid');
            } else if (depthDiff >= -0.01 && depthDiff <= 0.02) {
                greyReps++;
                document.getElementById('greyCount').innerText = greyReps;
                badge.innerText = "GREY ZONE";
                badge.classList.add('verdict-grey');
                playBeep('valid');
            } else {
                noReps++;
                document.getElementById('noRepCount').innerText = noReps;
                badge.innerText = "NO REP (TOO SHALLOW)";
                badge.classList.add('verdict-norep');
                playBeep('norep');
            }

            updateTotalDisplay();
            setTimeout(() => { badge.style.display = 'none'; }, 2000);
        }

        // Camera & MediaPipe Engine
        const videoElement = document.getElementById('videoInput');
        const canvasElement = document.getElementById('outputCanvas');
        const canvasCtx = canvasElement.getContext('2d');

        let currentStream = null;
        let currentFacingMode = 'environment'; // Default rear camera

        function onResults(results) {
            canvasElement.width = videoElement.videoWidth;
            canvasElement.height = videoElement.videoHeight;
            canvasCtx.save();
            canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
            canvasCtx.drawImage(results.image, 0, 0, canvasElement.width, canvasElement.height);

            if (results.poseLandmarks) {
                const landmarks = results.poseLandmarks;

                processSquatDepth(landmarks);

                // Bounding Box
                let minX = 1, minY = 1, maxX = 0, maxY = 0;
                landmarks.forEach(lm => {
                    if (lm.x < minX) minX = lm.x;
                    if (lm.y < minY) minY = lm.y;
                    if (lm.x > maxX) maxX = lm.x;
                    if (lm.y > maxY) maxY = lm.y;
                });

                canvasCtx.strokeStyle = "#00f0ff";
                canvasCtx.lineWidth = 4;
                canvasCtx.strokeRect(
                    minX * canvasElement.width, 
                    minY * canvasElement.height, 
                    (maxX - minX) * canvasElement.width, 
                    (maxY - minY) * canvasElement.height
                );

                // Squat Depth Line (Knee Benchmark)
                const leftKnee = landmarks[25];
                const rightKnee = landmarks[26];
                if (leftKnee && rightKnee) {
                    const avgKneeY = (leftKnee.y + rightKnee.y) / 2 * canvasElement.height;

                    canvasCtx.beginPath();
                    canvasCtx.setLineDash([10, 10]);
                    canvasCtx.moveTo(0, avgKneeY);
                    canvasCtx.lineTo(canvasElement.width, avgKneeY);
                    canvasCtx.strokeStyle = "#f59e0b";
                    canvasCtx.lineWidth = 4;
                    canvasCtx.stroke();
                    canvasCtx.setLineDash([]);

                    canvasCtx.fillStyle = "#f59e0b";
                    canvasCtx.font = "bold 16px sans-serif";
                    canvasCtx.fillText("MIN SQUAT DEPTH (KNEES)", 15, avgKneeY - 10);
                }
            }
            canvasCtx.restore();
        }

        const pose = new Pose({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        pose.setOptions({ modelComplexity: 1, smoothLandmarks: true, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        pose.onResults(onResults);

        // Frame Processing Loop
        async function processFrame() {
            if (videoElement.readyState >= 2 && !videoElement.paused) {
                await pose.send({image: videoElement});
            }
            requestAnimationFrame(processFrame);
        }

        // Native Camera Stream Switcher
        async function initCamera(facingMode) {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
            }

            try {
                const constraints = {
                    video: {
                        facingMode: { exact: facingMode },
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    },
                    audio: false
                };

                // Fallback to ideal if exact facingMode is rejected
                try {
                    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                } catch (e) {
                    currentStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: facingMode },
                        audio: false
                    });
                }

                videoElement.srcObject = currentStream;
                await videoElement.play();
            } catch (err) {
                console.error("Camera access error:", err);
            }
        }

        // Toggle Camera Button
        document.getElementById('flipCamBtn').addEventListener('click', async () => {
            currentFacingMode = (currentFacingMode === 'environment') ? 'user' : 'environment';
            await initCamera(currentFacingMode);
        });

        // Start Stream
        initCamera(currentFacingMode).then(() => {
            requestAnimationFrame(processFrame);
        });
    </script>
</body>
</html>
